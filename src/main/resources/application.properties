spring.application.name=finanzas-spring

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/finanzas}
spring.datasource.username=${DATABASE_USERNAME:finanzas}
spring.datasource.password=${DATABASE_PASSWORD:finanzas}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=finance
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.schemas=finance
spring.flyway.default-schema=finance
